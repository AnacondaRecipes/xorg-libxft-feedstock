{% set name = "xorg-libXft" %}
{% set version = "2.3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: 60a25b78945ed6932635b3bb1899a517d31df7456e69867ffba27f89ff3976f5

build:
  number: 1
  # xorg-libxdmcp, libxcb, libx11, libice aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  # Would need some library futzing to get the build fully working on Windows:
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin='x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - autoconf
    - automake
    - gettext
    - libtool
    - sed
  host:
    - xorg-xorgproto {{ xorg_xorgproto }}
    - pthread-stubs ==0.3
    - xorg-util-macros ==1.20.2
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-libxrender {{ xorg_libxrender }}
    - freetype {{ freetype }}
    - fontconfig {{ fontconfig }}

test:
  commands:
    - test -f $PREFIX/lib/libXft.dylib  # [osx]
    - test -f $PREFIX/lib/libXft.so     # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxft
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxft
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org FreeType library.
  description: The X.org FreeType library.

extra:
  recipe-maintainers:
    - pkgw
    - epruesse
